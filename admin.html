<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BRIMMO — Panel de administración</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root {
    --forest:#1F5A36; --forest-2:#2E7248; --lime:#A7C900; --olive:#7E9848;
    --ink:#2A2E24; --ink-2:#54594C; --ink-3:#83887A;
    --line:#DDE0D3; --line-2:#C6CAB8;
    --paper:#F7F8F2; --surface:#FFFFFF; --sunk:#EEF0E6;
    --danger:#B0392B; --danger-bg:#FBEDEA;
    --warn:#8A5A0B; --warn-bg:#FCF3E2;
    --ok:#1F5A36; --ok-bg:#EAF3E9;
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --radio: 3px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body {
    font-family: var(--font); background: var(--paper); color: var(--ink);
    font-size: 14.5px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--forest); text-decoration: none; }
  a:hover { color: var(--olive); }
  code { font-family: var(--mono); font-size: .9em; background: var(--sunk); padding: 1px 5px; border: 1px solid var(--line); }

  /* ========== Login ========== */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(160deg, #F7F8F2 0%, #E8ECDE 100%); }
  .login-card { background: var(--surface); border: 1px solid var(--line); padding: 40px 34px 34px; max-width: 380px; width: 100%; }
  .login-marca { display:flex; align-items:center; gap:12px; margin-bottom: 28px; }
  .login-marca span:first-child { display:inline-flex; align-items:center; justify-content:center; }
  .login-marca strong { font-family: "Montserrat", var(--font); font-size: 22px; font-weight: 800; color: var(--forest); letter-spacing: .01em; }
  .login-marca em { display:block; margin-top:2px; font-size:10px; font-style:normal; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color: var(--olive); }
  .login-card h1 { font-size: 20px; margin: 0 0 6px; color: var(--ink); font-family: "Montserrat", var(--font); font-weight: 700; }
  .login-card p { margin: 0 0 22px; color: var(--ink-2); font-size: 13.5px; }

  /* ========== Layout admin ========== */
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .side { background: var(--forest); color: #fff; padding: 26px 20px 20px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .side-marca { display:flex; align-items:center; gap:11px; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,.14); }
  .side-marca strong { font-family: "Montserrat", var(--font); font-size: 19px; font-weight: 800; color: #fff; letter-spacing: .01em; }
  .side-marca em { display:block; margin-top:2px; font-size: 9px; font-style: normal; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--lime); }
  .side nav a { display:flex; align-items:center; gap: 11px; padding: 10px 12px; border-radius: var(--radio); font-size: 13.5px; color: rgba(255,255,255,.75); font-weight: 500; }
  .side nav a:hover { background: rgba(255,255,255,.08); color: #fff; }
  .side nav a.activo { background: rgba(167,201,0,.16); color: #fff; }
  .side nav a.activo svg { color: var(--lime); }
  .side nav .grupo { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.45); padding: 20px 12px 8px; font-weight: 600; }
  .side-foot { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.14); font-size: 12px; color: rgba(255,255,255,.55); }
  .side-foot a { color: rgba(255,255,255,.75); }
  .side-foot a:hover { color: var(--lime); }
  .main { padding: 30px 40px 60px; max-width: 1240px; width: 100%; overflow-x: hidden; }

  /* ========== Componentes ========== */
  .page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
  .page-h h1 { font-family: "Montserrat", var(--font); font-size: 26px; font-weight: 800; color: var(--forest); margin: 0; letter-spacing: -.01em; }
  .page-h .subt { color: var(--ink-2); font-size: 13.5px; margin-top: 4px; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; height: 40px; border: 1px solid transparent; border-radius: var(--radio); font-family: var(--font); font-size: 13px; font-weight: 600; letter-spacing: .02em; cursor: pointer; transition: background .2s, border-color .2s, color .2s; text-decoration: none; white-space: nowrap; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--forest); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--forest-2); }
  .btn-secondary { background: var(--surface); color: var(--forest); border-color: var(--line-2); }
  .btn-secondary:hover:not(:disabled) { background: var(--sunk); border-color: var(--forest); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover:not(:disabled) { background: var(--danger); color: #fff; }
  .btn-ghost { background: transparent; color: var(--ink-2); }
  .btn-ghost:hover:not(:disabled) { color: var(--ink); background: var(--sunk); }
  .btn-sm { height: 32px; padding: 6px 12px; font-size: 12px; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; color: var(--ink-2); text-transform: uppercase; }
  .field .hint { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .field input[type="text"], .field input[type="email"], .field input[type="password"], .field input[type="number"], .field input[type="url"], .field select, .field textarea {
    width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radio); font-family: inherit; font-size: 14px; color: var(--ink); outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--forest); box-shadow: 0 0 0 3px rgba(31,90,54,.14); }
  .field textarea { resize: vertical; min-height: 100px; }
  .field.error input, .field.error select, .field.error textarea { border-color: var(--danger); }
  .field .err { font-size: 12px; color: var(--danger); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); padding: 22px 24px; margin-bottom: 22px; }
  .card h2 { font-family: "Montserrat", var(--font); font-size: 15px; margin: 0 0 18px; color: var(--forest); font-weight: 700; letter-spacing: .01em; text-transform: uppercase; letter-spacing: .08em; }

  /* ========== Tabla de propiedades ========== */
  .lista { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); overflow: hidden; }
  .lista-h { display: grid; grid-template-columns: 74px 1fr 90px 130px 150px 90px 130px; padding: 12px 20px; background: var(--sunk); border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .lista-row { display: grid; grid-template-columns: 74px 1fr 90px 130px 150px 90px 130px; padding: 14px 20px; align-items: center; border-bottom: 1px solid var(--line); gap: 10px; }
  .lista-row:last-child { border-bottom: 0; }
  .lista-row:hover { background: var(--sunk); }
  .lista-row .thumb { width: 60px; height: 45px; object-fit: cover; background: linear-gradient(150deg,#22633C,#17452A); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.4); font-size: 10px; }
  .lista-row .titulo { font-weight: 600; color: var(--ink); font-size: 13.5px; line-height: 1.4; }
  .lista-row .zone { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
  .chip { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: var(--radio); }
  .chip-pub { background: var(--ok-bg); color: var(--ok); }
  .chip-draft { background: var(--warn-bg); color: var(--warn); }
  .chip-featured { background: rgba(167,201,0,.18); color: var(--olive); margin-left: 4px; }
  .num-mono { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
  .lista-vacia { padding: 60px 20px; text-align: center; color: var(--ink-3); }

  .filtros { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filtros input, .filtros select { padding: 8px 12px; height: 36px; border: 1px solid var(--line-2); border-radius: var(--radio); font-size: 13px; background: var(--surface); color: var(--ink); font-family: inherit; }
  .filtros input:focus, .filtros select:focus { outline: none; border-color: var(--forest); }
  .filtros input[type="search"] { min-width: 240px; }
  .filtros .contador { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }

  /* ========== Editor propiedad ========== */
  .editor-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: start; }
  @media (max-width: 960px) { .editor-grid { grid-template-columns: 1fr; } }

  .tabs { display: flex; border-bottom: 1px solid var(--line-2); margin-bottom: 20px; gap: 2px; }
  .tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 10px 16px; font-family: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); cursor: pointer; }
  .tabs button.activo { color: var(--forest); border-bottom-color: var(--lime); }
  .tab-panel { display: none; }
  .tab-panel.activo { display: block; }

  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .switch input { appearance: none; width: 38px; height: 22px; background: var(--line-2); border-radius: 12px; position: relative; cursor: pointer; transition: background .2s; }
  .switch input:checked { background: var(--forest); }
  .switch input::before { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: transform .2s; }
  .switch input:checked::before { transform: translateX(16px); }
  .switch span { font-size: 13.5px; color: var(--ink); font-weight: 500; }

  .features-lista { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .feature-row { display: flex; gap: 6px; align-items: center; }
  .feature-row input { flex: 1; padding: 8px 12px; border: 1px solid var(--line-2); border-radius: var(--radio); font-family: inherit; font-size: 13.5px; }
  .feature-row input:focus { outline: none; border-color: var(--forest); }
  .btn-icon { padding: 8px; height: 34px; width: 34px; }

  /* ========== Imágenes ========== */
  .dropzone { border: 2px dashed var(--line-2); border-radius: var(--radio); padding: 28px 20px; text-align: center; color: var(--ink-3); cursor: pointer; transition: background .2s, border-color .2s; }
  .dropzone:hover, .dropzone.dragover { background: var(--sunk); border-color: var(--forest); color: var(--ink-2); }
  .dropzone strong { color: var(--forest); display: block; margin-bottom: 4px; font-size: 14px; }
  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
  .img-item { position: relative; aspect-ratio: 4/3; overflow: hidden; border: 1px solid var(--line-2); border-radius: var(--radio); background: var(--sunk); cursor: grab; }
  .img-item[draggable="true"]:active { cursor: grabbing; }
  .img-item.arrastrando { opacity: .4; }
  .img-item.marca-drop { border-color: var(--lime); border-width: 2px; }
  .img-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img-item .principal-badge { position: absolute; top: 8px; left: 8px; background: var(--lime); color: var(--forest); font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 7px; border-radius: 2px; }
  .img-item .img-actions { position: absolute; bottom: 8px; left: 8px; right: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity .2s; }
  .img-item:hover .img-actions { opacity: 1; }
  .img-item .img-actions button { flex: 1; background: rgba(0,0,0,.7); color: #fff; border: 0; padding: 5px 6px; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; border-radius: 2px; cursor: pointer; }
  .img-item .img-actions button:hover { background: rgba(0,0,0,.9); }
  .img-item.subiendo { opacity: .7; }
  .img-item .barra { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--lime); }

  /* ========== Toasts ========== */
  #toasts { position: fixed; bottom: 22px; right: 22px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; max-width: 340px; }
  .toast { padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--forest); border-radius: var(--radio); box-shadow: 0 8px 22px -12px rgba(23,45,30,.24); font-size: 13.5px; color: var(--ink); animation: aparecer .25s ease; }
  .toast.error { border-left-color: var(--danger); }
  .toast.warn { border-left-color: var(--warn); }
  @keyframes aparecer { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ========== Estados ========== */
  .cargando { text-align: center; padding: 60px 20px; color: var(--ink-3); }
  .banner-config { background: var(--warn-bg); border-left: 3px solid var(--warn); padding: 14px 18px; margin-bottom: 20px; border-radius: var(--radio); font-size: 13.5px; }
  .banner-config strong { color: var(--warn); }
  .banner-config code { background: rgba(0,0,0,.05); }

  /* ========== Móvil ========== */
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; padding: 20px; flex-direction: row; overflow-x: auto; }
    .side-marca { margin: 0 12px 0 0; padding: 0 12px 0 0; border-bottom: 0; border-right: 1px solid rgba(255,255,255,.14); }
    .side nav { display: flex; gap: 4px; }
    .side nav a { padding: 8px 12px; white-space: nowrap; }
    .side nav .grupo, .side-foot { display: none; }
    .main { padding: 24px 20px 40px; }
    .lista-h, .lista-row { grid-template-columns: 60px 1fr auto; gap: 12px; }
    .lista-h .col-hide, .lista-row .col-hide { display: none; }
    .lista-row .thumb { width: 60px; height: 60px; }
  }
</style>
</head>
<body>

<div id="root"><div class="cargando">Cargando…</div></div>
<div id="toasts"></div>

<script src="./sb-config.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
// =========================================================================
// BRIMMO — Panel administrativo
// Todo el admin en un solo archivo. Funciona sin build, sin bundler.
// Vanilla JS + Supabase SDK, hash routing, event delegation en <body>.
// =========================================================================

const CFG = {
  URL: window.SUPABASE_URL || "",
  KEY: window.SUPABASE_ANON_KEY || "",
  BUCKET: window.SUPABASE_BUCKET || "brimmo-imagenes"
};

const TIPOS = ["Villa", "Casa", "Quinta", "Terreno", "Rancho", "Departamento"];
const OPERACIONES = ["VENTA", "ALQUILER"];
const MONEDAS = ["USD", "GS"];

const state = {
  ready: false,
  user: null,
  props: [],
  cur: null,           // propiedad en edición (o null)
  imgs: [],            // imágenes de la propiedad en edición
  settings: null,
  route: parseRoute(),
  tabIdioma: "es",
  filtros: { q: "", tipo: "", ciudad: "", estado: "" }
};

let sb = null;
if (CFG.URL && CFG.KEY && window.supabase) sb = window.supabase.createClient(CFG.URL, CFG.KEY);

// =========================================================================
// Utilidades
// =========================================================================
const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const attr = s => esc(s).replace(/`/g, "&#96;");

function toast(msg, tipo = "info") {
  const t = document.createElement("div");
  t.className = "toast " + (tipo === "error" ? "error" : tipo === "warn" ? "warn" : "");
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transform = "translateY(6px)"; t.style.transition = "opacity .3s, transform .3s"; }, 3500);
  setTimeout(() => t.remove(), 4000);
}

function parseRoute() {
  const h = location.hash.replace(/^#/, "") || "/";
  if (h === "/" || h === "") return { name: "lista" };
  if (h === "/nueva") return { name: "editor", id: null };
  const m = h.match(/^\/editar\/(\d+)$/);
  if (m) return { name: "editor", id: +m[1] };
  if (h === "/contacto") return { name: "contacto" };
  return { name: "lista" };
}

function irA(hash) { location.hash = hash; }
window.addEventListener("hashchange", () => { state.route = parseRoute(); render(); });

function urlImagen(path) {
  return path ? CFG.URL + "/storage/v1/object/public/" + CFG.BUCKET + "/" + path : null;
}

function idVideo(v) {
  if (!v) return null;
  const m = String(v).match(/([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function labelPrecio(p) {
  if (p.price == null) return "—";
  const n = p.price.toLocaleString("es-PY");
  if (p.currency === "USD") return "USD " + n;
  if (p.currency === "GS") return "Gs. " + n;
  return n;
}

// =========================================================================
// Datos: Supabase
// =========================================================================
async function fetchProps() {
  if (!sb) return { data: [], error: new Error("Supabase no configurado") };
  return await sb.from("propiedades")
    .select("*, propiedad_imagenes(id,storage_path,orden,es_principal,alt_es,alt_fr,alt_en)")
    .order("orden", { ascending: true });
}

async function fetchProp(id) {
  if (!sb) return { data: null, error: new Error("Supabase no configurado") };
  return await sb.from("propiedades")
    .select("*, propiedad_imagenes(id,storage_path,orden,es_principal,alt_es,alt_fr,alt_en)")
    .eq("id", id).single();
}

async function saveProp(p) {
  const { propiedad_imagenes, id, ...datos } = p;
  if (id) {
    return await sb.from("propiedades").update(datos).eq("id", id).select().single();
  }
  return await sb.from("propiedades").insert(datos).select().single();
}

async function deleteProp(id) {
  return await sb.from("propiedades").delete().eq("id", id);
}

async function fetchSettings() {
  if (!sb) return { data: null, error: new Error("Supabase no configurado") };
  return await sb.from("settings").select("*").eq("id", 1).maybeSingle();
}

async function saveSettings(s) {
  return await sb.from("settings").update(s).eq("id", 1).select().single();
}

async function uploadImagen(propId, file) {
  const ext = (file.name.match(/\.[^.]+$/) || [""])[0].toLowerCase() || ".jpg";
  const path = "prop-" + propId + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + ext;
  const up = await sb.storage.from(CFG.BUCKET).upload(path, file, { contentType: file.type, upsert: false });
  if (up.error) return { error: up.error };
  const maxOrden = Math.max(0, ...(state.imgs.map(i => i.orden)));
  const esPrimera = state.imgs.length === 0;
  const ins = await sb.from("propiedad_imagenes").insert({
    propiedad_id: propId, storage_path: path, orden: maxOrden + 10, es_principal: esPrimera
  }).select().single();
  if (ins.error) {
    await sb.storage.from(CFG.BUCKET).remove([path]);   // rollback
    return { error: ins.error };
  }
  return { data: ins.data };
}

async function deleteImagen(img) {
  await sb.storage.from(CFG.BUCKET).remove([img.storage_path]);
  return await sb.from("propiedad_imagenes").delete().eq("id", img.id);
}

async function setPrincipal(propId, imgId) {
  // La constraint UNIQUE parcial no acepta dos con es_principal=true.
  // Se limpia primero y se marca la nueva.
  await sb.from("propiedad_imagenes").update({ es_principal: false }).eq("propiedad_id", propId);
  return await sb.from("propiedad_imagenes").update({ es_principal: true }).eq("id", imgId);
}

async function guardarOrdenImagenes(imgs) {
  // Se envían en lotes para no hacer una request por imagen
  for (let i = 0; i < imgs.length; i++) {
    await sb.from("propiedad_imagenes").update({ orden: (i + 1) * 10 }).eq("id", imgs[i].id);
  }
}

// =========================================================================
// Auth
// =========================================================================
async function initAuth() {
  if (!sb) { renderConfig(); return; }
  const { data } = await sb.auth.getSession();
  state.user = data.session ? data.session.user : null;
  state.ready = true;
  sb.auth.onAuthStateChange((_evt, session) => {
    state.user = session ? session.user : null;
    render();
  });
  if (state.user) {
    await cargarTodo();
  }
  render();
}

async function login(email, password) {
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) throw error;
  await cargarTodo();
}

async function logout() {
  await sb.auth.signOut();
  state.props = []; state.settings = null; state.cur = null; state.imgs = [];
  irA("/");
}

async function cargarTodo() {
  const [p, s] = await Promise.all([fetchProps(), fetchSettings()]);
  if (!p.error) state.props = p.data || [];
  if (!s.error && s.data) state.settings = s.data;
}

// =========================================================================
// Render principal
// =========================================================================
function render() {
  if (!CFG.URL || !CFG.KEY) return renderConfig();
  if (!state.ready) return;
  if (!state.user) return renderLogin();
  renderApp();
}

function renderLista(mount) {
  const ciudades = [...new Set(state.props.map(p => p.city))].sort();
  const f = state.filtros;
  let list = state.props;
  if (f.q) { const k = f.q.toLowerCase(); list = list.filter(p => (p.title_es + " " + p.city + " " + (p.zone_es || "")).toLowerCase().includes(k)); }
  if (f.tipo) list = list.filter(p => p.type === f.tipo);
  if (f.ciudad) list = list.filter(p => p.city === f.ciudad);
  if (f.estado === "pub") list = list.filter(p => p.published);
  if (f.estado === "draft") list = list.filter(p => !p.published);

  mount.innerHTML = `
    <div class="page-h">
      <div><h1>Propiedades</h1><div class="subt">${state.props.length} en total · ${state.props.filter(p => p.published).length} publicadas · ${state.props.filter(p => !p.published).length} borradores</div></div>
      <div class="actions">
        <a class="btn btn-secondary" href="index.html" target="_blank">Ver el sitio</a>
        <a class="btn btn-primary" href="#/nueva">+ Nueva propiedad</a>
      </div>
    </div>

    <div class="filtros">
      <input id="f-q" type="search" placeholder="Buscar por título, ciudad o zona" value="${attr(f.q)}">
      <select id="f-tipo">
        <option value="">Todos los tipos</option>
        ${TIPOS.map(t => `<option value="${t}"${f.tipo === t ? " selected" : ""}>${t}</option>`).join("")}
      </select>
      <select id="f-ciudad">
        <option value="">Todas las ciudades</option>
        ${ciudades.map(c => `<option value="${attr(c)}"${f.ciudad === c ? " selected" : ""}>${esc(c)}</option>`).join("")}
      </select>
      <select id="f-estado">
        <option value="">Todos los estados</option>
        <option value="pub"${f.estado === "pub" ? " selected" : ""}>Publicadas</option>
        <option value="draft"${f.estado === "draft" ? " selected" : ""}>Borradores</option>
      </select>
      <div class="contador">${list.length} ${list.length === 1 ? "resultado" : "resultados"}</div>
    </div>

    <div class="lista">
      <div class="lista-h">
        <div>Foto</div>
        <div>Título</div>
        <div class="col-hide">Tipo</div>
        <div class="col-hide">Ciudad</div>
        <div class="col-hide">Precio</div>
        <div class="col-hide">Estado</div>
        <div></div>
      </div>
      ${list.length === 0 ? `<div class="lista-vacia">No hay propiedades con esos filtros.</div>` : list.map(rowPropiedad).join("")}
    </div>`;

  ["f-q", "f-tipo", "f-ciudad", "f-estado"].forEach(id => {
    $("#" + id).addEventListener("input", (e) => {
      const key = id.slice(2);
      state.filtros[key === "q" ? "q" : key] = e.target.value;
      renderLista(mount);
    });
  });
}

function rowPropiedad(p) {
  const imgs = (p.propiedad_imagenes || []).slice().sort((a, b) => a.orden - b.orden);
  const principal = imgs.find(i => i.es_principal) || imgs[0];
  const thumb = principal ? `<img class="thumb" src="${attr(urlImagen(principal.storage_path))}" alt="">` : `<div class="thumb">Sin foto</div>`;
  return `<div class="lista-row">
    ${thumb}
    <div>
      <div class="titulo">${esc(p.title_es)}${p.featured ? ` <span class="chip chip-featured">Destacada</span>` : ""}</div>
      <div class="zone">${esc(p.zone_es || "")}${p.zone_es ? " · " : ""}${p.type}${p.pendiente ? ` · <span title="${attr(p.pendiente)}" style="color:var(--warn)">pendiente</span>` : ""}</div>
    </div>
    <div class="col-hide num-mono">${esc(p.type)}</div>
    <div class="col-hide num-mono">${esc(p.city)}</div>
    <div class="col-hide num-mono">${labelPrecio(p)}</div>
    <div class="col-hide">${p.published ? `<span class="chip chip-pub">Publicada</span>` : `<span class="chip chip-draft">Borrador</span>`}</div>
    <div style="text-align:right"><a class="btn btn-secondary btn-sm" href="#/editar/${p.id}">Editar</a></div>
  </div>`;
}

function renderEditor(mount, id) {
  if (id) {
    // Cargar desde la lista si ya la tenemos, y refrescar desde red
    const existente = state.props.find(p => p.id === id);
    if (existente) {
      state.cur = { ...existente };
      state.imgs = (existente.propiedad_imagenes || []).slice().sort((a, b) => a.orden - b.orden);
    }
    fetchProp(id).then(({ data, error }) => {
      if (error) return toast("No se pudo cargar la propiedad: " + error.message, "error");
      state.cur = { ...data };
      state.imgs = (data.propiedad_imagenes || []).slice().sort((a, b) => a.orden - b.orden);
      renderEditor(mount, id);
    });
    if (!existente) { mount.innerHTML = `<div class="cargando">Cargando propiedad…</div>`; return; }
  } else {
    state.cur = state.cur && !state.cur.id ? state.cur : {
      type: "Villa", operation: "VENTA", currency: "USD", city: "",
      title_es: "", title_fr: "", title_en: "",
      zone_es: "", zone_fr: "", zone_en: "",
      desc_es: "", desc_fr: "", desc_en: "",
      features_es: [], features_fr: [], features_en: [],
      published: false, featured: false,
      price: null, land: null, built: null, beds: null, baths: null,
      video_id: "", maps_short: "", maps_long: "",
      lat: null, lng: null, pendiente: null, orden: 0
    };
    state.imgs = [];
  }

  const p = state.cur;
  mount.innerHTML = `
    <div class="page-h">
      <div>
        <h1>${id ? "Editar propiedad" : "Nueva propiedad"}</h1>
        <div class="subt">${id ? `ID ${id} · ` : ""}Los cambios se guardan al presionar <em>Guardar</em>.</div>
      </div>
      <div class="actions">
        <a class="btn btn-ghost" href="#/">← Volver</a>
        ${id ? `<button class="btn btn-danger" id="btn-eliminar">Eliminar</button>` : ""}
        <button class="btn btn-primary" id="btn-guardar">Guardar</button>
      </div>
    </div>

    <div class="editor-grid">
      <div>
        <div class="card">
          <h2>Contenido en 3 idiomas</h2>
          <div class="tabs" role="tablist">
            <button data-idioma="es" class="${state.tabIdioma === "es" ? "activo" : ""}">Español</button>
            <button data-idioma="fr" class="${state.tabIdioma === "fr" ? "activo" : ""}">Français</button>
            <button data-idioma="en" class="${state.tabIdioma === "en" ? "activo" : ""}">English</button>
          </div>
          ${["es", "fr", "en"].map(l => panelIdiomaHTML(p, l)).join("")}
        </div>

        <div class="card">
          <h2>Datos generales</h2>
          <div class="grid-3">
            <div class="field"><label>Tipo</label>
              <select data-campo="type">${TIPOS.map(t => `<option value="${t}"${p.type === t ? " selected" : ""}>${t}</option>`).join("")}</select>
            </div>
            <div class="field"><label>Operación</label>
              <select data-campo="operation">${OPERACIONES.map(o => `<option value="${o}"${p.operation === o ? " selected" : ""}>${o}</option>`).join("")}</select>
            </div>
            <div class="field"><label>Ciudad</label><input type="text" data-campo="city" value="${attr(p.city)}" required></div>
          </div>
          <div class="grid-3">
            <div class="field"><label>Precio</label><input type="number" data-campo="price" value="${p.price == null ? "" : p.price}" min="0"></div>
            <div class="field"><label>Moneda</label>
              <select data-campo="currency"><option value="">—</option>${MONEDAS.map(m => `<option value="${m}"${p.currency === m ? " selected" : ""}>${m}</option>`).join("")}</select>
            </div>
            <div class="field"><label>Superficie terreno (m²)</label><input type="number" data-campo="land" value="${p.land == null ? "" : p.land}" min="0"></div>
          </div>
          <div class="grid-3">
            <div class="field"><label>Superficie construida (m²)</label><input type="number" data-campo="built" value="${p.built == null ? "" : p.built}" min="0"></div>
            <div class="field"><label>Dormitorios</label><input type="number" data-campo="beds" value="${p.beds == null ? "" : p.beds}" min="0"></div>
            <div class="field"><label>Baños</label><input type="number" data-campo="baths" value="${p.baths == null ? "" : p.baths}" min="0"></div>
          </div>
        </div>

        <div class="card">
          <h2>Video de YouTube</h2>
          <div class="field">
            <label>Pegá la URL o el ID</label>
            <input type="text" id="input-video" data-campo="video_id" value="${attr(p.video_id || "")}" placeholder="https://www.youtube.com/watch?v=… o solo el ID">
            <div class="hint" id="video-preview"></div>
          </div>
        </div>

        <div class="card">
          <h2>Ubicación en Google Maps</h2>
          <div class="field">
            <label>URL corta (para compartir)</label>
            <input type="url" data-campo="maps_short" value="${attr(p.maps_short || "")}" placeholder="https://maps.app.goo.gl/…">

          <div class="field">
            <label>URL de embed (iframe)</label>
            <input type="url" data-campo="maps_long" value="${attr(p.maps_long || "")}" placeholder="https://www.google.com/maps/embed?…">

          </div>
          <div class="grid-2">
            <div class="field"><label>Latitud (opcional)</label><input type="number" step="0.000001" data-campo="lat" value="${p.lat == null ? "" : p.lat}" placeholder="-25.386100"></div>
            <div class="field"><label>Longitud (opcional)</label><input type="number" step="0.000001" data-campo="lng" value="${p.lng == null ? "" : p.lng}" placeholder="-57.140800"></div>
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <h2>Estado</h2>
          <label class="switch" style="margin-bottom:12px"><input type="checkbox" data-campo="published"${p.published ? " checked" : ""}><span>Publicada</span></label><br>
          <label class="switch" style="margin-bottom:16px"><input type="checkbox" data-campo="featured"${p.featured ? " checked" : ""}><span>Destacada</span></label>
          <div class="field"><label>Orden en el catálogo</label><input type="number" data-campo="orden" value="${p.orden || 0}" step="10"><div class="hint">Menor primero. Usá múltiplos de 10 para dejar huecos.</div></div>
          <div class="field"><label>Nota interna (pendiente)</label><textarea data-campo="pendiente" rows="3" placeholder="Ej: Confirmar precio con el propietario.">${esc(p.pendiente || "")}</textarea><div class="hint">No se muestra en el sitio. Sirve para recordar dudas.</div></div>
        </div>

        <div class="card">
          <h2>Fotografías</h2>
          ${id ? renderImgsHTML() : `<div class="hint">Guardá la propiedad primero para poder subir fotos.</div>`}
        </div>
      </div>
    </div>`;

  // Refresh preview de video
  actualizarVideoPreview();

  // Tabs de idioma
  $$(".tabs button", mount).forEach(b => b.addEventListener("click", () => {
    state.tabIdioma = b.dataset.idioma;
    $$(".tabs button", mount).forEach(x => x.classList.toggle("activo", x.dataset.idioma === state.tabIdioma));
    $$(".tab-panel", mount).forEach(x => x.classList.toggle("activo", x.dataset.idioma === state.tabIdioma));
  }));

  // Sincronizar cambios de campos al state.cur
  $$("[data-campo]", mount).forEach(el => {
    el.addEventListener("input", () => {
      const c = el.dataset.campo;
      let v;
      if (el.type === "checkbox") v = el.checked;
      else if (el.type === "number") v = el.value === "" ? null : Number(el.value);
      else v = el.value;
      state.cur[c] = v;
      if (c === "video_id") actualizarVideoPreview();
    });
  });

  // Features: agregar / quitar
  ["es", "fr", "en"].forEach(l => {
    const btn = $("#btn-add-feat-" + l);
    if (btn) btn.addEventListener("click", () => {
      state.cur["features_" + l] = [...(state.cur["features_" + l] || []), ""];
      renderEditor(mount, id);
    });
    $$("[data-feat-remove][data-lang='" + l + "']", mount).forEach(b => {
      b.addEventListener("click", () => {
        const i = +b.dataset.i;
        state.cur["features_" + l] = (state.cur["features_" + l] || []).filter((_, k) => k !== i);
        renderEditor(mount, id);
      });
    });
    $$("[data-feat-input][data-lang='" + l + "']", mount).forEach(inp => {
      inp.addEventListener("input", () => {
        const i = +inp.dataset.i;
        state.cur["features_" + l][i] = inp.value;
      });
    });
  });

  $("#btn-guardar").addEventListener("click", () => onGuardar(mount));
  if (id && $("#btn-eliminar")) $("#btn-eliminar").addEventListener("click", () => onEliminar(id));
  if (id) bindImagenes(mount, id);
}

function panelIdiomaHTML(p, l) {
  const feats = p["features_" + l] || [];
  const req = l === "es" ? " required" : "";
  const nombre = l === "es" ? "obligatorio" : "opcional";
  return `<div class="tab-panel${state.tabIdioma === l ? " activo" : ""}" data-idioma="${l}">
    <div class="hint" style="margin-bottom:14px">Contenido en <strong>${l === "es" ? "español" : l === "fr" ? "francés" : "inglés"}</strong> · ${nombre}</div>
    <div class="field"><label>Título</label><input type="text" data-campo="title_${l}" value="${attr(p["title_" + l] || "")}"${req}></div>
    <div class="field"><label>Zona / barrio</label><input type="text" data-campo="zone_${l}" value="${attr(p["zone_" + l] || "")}"></div>
    <div class="field"><label>Descripción</label><textarea data-campo="desc_${l}" rows="6">${esc(p["desc_" + l] || "")}</textarea></div>
    <div class="field">
      <label>Características</label>
      <div class="features-lista">
        ${feats.map((f, i) => `
          <div class="feature-row">
            <input type="text" data-feat-input data-lang="${l}" data-i="${i}" value="${attr(f)}" placeholder="Ej: Piscina">
            <button type="button" class="btn btn-secondary btn-icon" data-feat-remove data-lang="${l}" data-i="${i}" aria-label="Quitar">×</button>
          </div>
        `).join("")}
      </div>
      <button type="button" class="btn btn-secondary btn-sm" id="btn-add-feat-${l}">+ Agregar característica</button>
    </div>
  </div>`;
}

function actualizarVideoPreview() {
  const inp = $("#input-video");
  const box = $("#video-preview");
  if (!inp || !box) return;
  const vid = idVideo(inp.value);
  if (!vid) { box.textContent = "Sin video."; box.style.color = ""; return; }
  box.innerHTML = `ID detectado: <code>${vid}</code> · <a href="https://youtu.be/${vid}" target="_blank" rel="noopener">ver en YouTube</a>`;
  state.cur.video_id = vid;
}

async function onGuardar(mount) {
  const p = state.cur;
  if (!p.title_es || !p.title_es.trim()) return toast("El título en español es obligatorio.", "error");
  if (!p.city || !p.city.trim()) return toast("La ciudad es obligatoria.", "error");
  // Normalizar: features vacías -> array vacío, video_id -> ID limpio
  ["es", "fr", "en"].forEach(l => {
    p["features_" + l] = (p["features_" + l] || []).map(s => s.trim()).filter(Boolean);
  });
  p.video_id = idVideo(p.video_id) || null;
  p.price = p.price == null || p.price === "" ? null : Number(p.price);
  p.land = p.land == null || p.land === "" ? null : Number(p.land);
  p.built = p.built == null || p.built === "" ? null : Number(p.built);
  p.beds = p.beds == null || p.beds === "" ? null : Number(p.beds);
  p.baths = p.baths == null || p.baths === "" ? null : Number(p.baths);
  p.lat = p.lat == null || p.lat === "" ? null : Number(p.lat);
  p.lng = p.lng == null || p.lng === "" ? null : Number(p.lng);
  if (!p.currency) p.currency = null;

  const btn = $("#btn-guardar"); btn.disabled = true; btn.textContent = "Guardando…";
  try {
    const { data, error } = await saveProp(p);
    if (error) throw error;
    toast(p.id ? "Propiedad guardada." : "Propiedad creada.");
    // Refrescar la lista y quedarse en el editor con el ID nuevo
    await cargarTodo();
    if (!p.id && data) {
      state.cur = { ...data };
      irA("#/editar/" + data.id);
    } else {
      renderEditor(mount, p.id);
    }
  } catch (err) {
    toast("Error al guardar: " + (err.message || err), "error");
  } finally {
    btn.disabled = false; btn.textContent = "Guardar";
  }
}

async function onEliminar(id) {
  if (!confirm("¿Eliminar esta propiedad y todas sus fotos? Esta acción no se puede deshacer.")) return;
  try {
    // borrar imágenes del storage primero
    for (const img of state.imgs) await sb.storage.from(CFG.BUCKET).remove([img.storage_path]);
    const { error } = await deleteProp(id);
    if (error) throw error;
    toast("Propiedad eliminada.");
    await cargarTodo();
    irA("/");
  } catch (err) {
    toast("Error al eliminar: " + (err.message || err), "error");
  }
}

        <div class="img-item" draggable="true" data-id="${img.id}" data-i="${i}">
          <img src="${attr(urlImagen(img.storage_path))}" alt="">
          ${img.es_principal ? `<span class="principal-badge">Principal</span>` : ""}
          <div class="img-actions">
            ${img.es_principal ? "" : `<button data-act="principal" data-id="${img.id}">Marcar principal</button>`}
            <button data-act="borrar" data-id="${img.id}">Borrar</button>
          </div>
        </div>
      `).join("")}
    </div>
    <div class="hint" style="margin-top:10px">${state.imgs.length ? "Arrastrá las fotos para reordenar · La primera se muestra como imagen principal en tarjetas y detalle si no marcás otra." : "Todavía no hay fotos."}</div>`;
}

function bindImagenes(mount, propId) {
  const dz = $("#dz"), input = $("#dz-input");
  if (!dz) return;
  dz.addEventListener("click", () => input.click());
  dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("dragover"); });
  dz.addEventListener("dragleave", () => dz.classList.remove("dragover"));
  dz.addEventListener("drop", (e) => {
    e.preventDefault(); dz.classList.remove("dragover");
    subirVarias(mount, propId, [...e.dataTransfer.files]);
  });
  input.addEventListener("change", () => subirVarias(mount, propId, [...input.files]));

  // Acciones sobre las miniaturas
  $$("[data-act]", mount).forEach(b => b.addEventListener("click", async (e) => {
    e.stopPropagation();
    const id = +b.dataset.id;
    if (b.dataset.act === "principal") {
      const { error } = await setPrincipal(propId, id);
      if (error) return toast("No se pudo marcar como principal: " + error.message, "error");
      state.imgs = state.imgs.map(i => ({ ...i, es_principal: i.id === id }));
      renderEditor(mount, propId);
    } else if (b.dataset.act === "borrar") {
      if (!confirm("¿Borrar esta foto?")) return;
      const img = state.imgs.find(i => i.id === id);
      const { error } = await deleteImagen(img);
      if (error) return toast("Error al borrar: " + error.message, "error");
      state.imgs = state.imgs.filter(i => i.id !== id);
      renderEditor(mount, propId);
    }
  }));

  // Drag & drop para reordenar
  let arrastrando = null;
  $$(".img-item", mount).forEach(el => {
    el.addEventListener("dragstart", () => { arrastrando = el; el.classList.add("arrastrando"); });
    el.addEventListener("dragend", () => { el.classList.remove("arrastrando"); $$(".img-item.marca-drop", mount).forEach(x => x.classList.remove("marca-drop")); arrastrando = null; });
    el.addEventListener("dragover", (e) => { e.preventDefault(); if (arrastrando && el !== arrastrando) el.classList.add("marca-drop"); });
    el.addEventListener("dragleave", () => el.classList.remove("marca-drop"));
    el.addEventListener("drop", async (e) => {
      e.preventDefault(); el.classList.remove("marca-drop");
      if (!arrastrando || arrastrando === el) return;
      const from = +arrastrando.dataset.i, to = +el.dataset.i;
      const arr = state.imgs.slice();
      const [m] = arr.splice(from, 1);
      arr.splice(to, 0, m);
      state.imgs = arr;
      renderEditor(mount, propId);
      try { await guardarOrdenImagenes(state.imgs); toast("Orden guardado."); }
      catch (err) { toast("No se pudo guardar el orden: " + err.message, "error"); }
    });
  });
}

async function subirVarias(mount, propId, files) {
  const validos = files.filter(f => /^image\/(jpe?g|png|webp)$/.test(f.type) && f.size <= 10 * 1024 * 1024);
  const rechazados = files.length - validos.length;
  if (rechazados) toast(rechazados + " archivo(s) ignorado(s): solo JPEG/PNG/WebP hasta 10 MB.", "warn");
  for (const f of validos) {
    const { data, error } = await uploadImagen(propId, f);
    if (error) { toast("Error al subir " + f.name + ": " + error.message, "error"); continue; }
    state.imgs.push(data);
  }
  renderEditor(mount, propId);
  if (validos.length) toast(validos.length + " foto(s) subida(s).");
}

// =========================================================================
// Vista: contacto (settings)
// =========================================================================
function renderContacto(mount) {
  const s = state.settings || {
    telefono: "", whatsapp: "", email: "", direccion: "",
    facebook_url: "", youtube_url: ""
  };
  mount.innerHTML = `
    <div class="page-h">
      <div><h1>Datos de contacto</h1><div class="subt">Se muestran en el sitio (header, sección de contacto, footer y botón flotante).</div></div>
    </div>
    <div class="card" style="max-width:640px">
      <div class="field"><label>Teléfono (visible en el sitio)</label>
        <input type="text" id="s-tel" value="${attr(s.telefono)}" placeholder="+595 992 984 777">
        <div class="hint">Formato libre, como quiera mostrarse.</div>
      </div>
      <div class="field"><label>WhatsApp (solo dígitos)</label>
        <input type="text" id="s-wa" value="${attr(s.whatsapp)}" placeholder="595992984777">
        <div class="hint">Sin +, sin espacios. Se usa para <code>wa.me/…</code>.</div>
      </div>
      <div class="field"><label>Correo</label>
        <input type="email" id="s-mail" value="${attr(s.email)}" placeholder="contacto@brimmo.com">
      </div>
      <div class="field"><label>Ubicación / dirección</label>
        <input type="text" id="s-dir" value="${attr(s.direccion)}" placeholder="Cabañas, Caacupé, Paraguay">
      </div>
      <div class="field"><label>Facebook (URL completa)</label>
        <input type="url" id="s-fb" value="${attr(s.facebook_url)}" placeholder="https://www.facebook.com/…">
      </div>
      <div class="field"><label>YouTube (URL del canal)</label>
        <input type="url" id="s-yt" value="${attr(s.youtube_url)}" placeholder="https://www.youtube.com/@…">
      </div>
      <div style="display:flex;gap:10px;margin-top:8px">
        <button class="btn btn-primary" id="s-guardar">Guardar cambios</button>
      </div>
    </div>`;
  $("#s-guardar").addEventListener("click", async () => {
    const b = $("#s-guardar"); b.disabled = true; b.textContent = "Guardando…";
    try {
      const { data, error } = await saveSettings({
        telefono: $("#s-tel").value.trim(),
        whatsapp: $("#s-wa").value.trim().replace(/[^\d]/g, ""),
        email: $("#s-mail").value.trim(),
        direccion: $("#s-dir").value.trim(),
        facebook_url: $("#s-fb").value.trim(),
        youtube_url: $("#s-yt").value.trim()
      });
      if (error) throw error;
      state.settings = data;
      toast("Datos de contacto guardados.");
    } catch (err) {
      toast("Error: " + err.message, "error");
    } finally {
      b.disabled = false; b.textContent = "Guardar cambios";
    }
  });
}
